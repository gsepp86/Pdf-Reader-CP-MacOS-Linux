name: Release macOS e Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # egui/eframe (X11/Wayland + OpenGL) e libcups (collegata dal crate `printers`)
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libcups2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compila e impacchetta
        # chmod esplicito: caricando i file dal browser il permesso di esecuzione si perde
        run: chmod +x build-unix.sh && ./build-unix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PDFReaderCP-linux
          path: dist/*

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    name: macOS universale
    # macos-14 e' stato ritirato il 2 novembre 2026: l'allocazione del runner
    # fallisce con "configuration 'macos-14-arm64-us-default' is not supported".
    # macos-15 e' arm64 (Apple Silicon) e resta disponibile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compila e impacchetta
        run: chmod +x build-unix.sh && ./build-unix.sh --universal

      - uses: actions/upload-artifact@v4
        with:
          name: PDFReaderCP-macos
          path: dist/*

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
