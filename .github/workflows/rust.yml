name: Release macOS e Linux

on:
  workflow_dispatch:
  push:
    # un push su main fa partire la build (artifact); la release viene creata
    # quando il push e' un tag v* oppure un ramo release/v* (es. release/v3.0.0),
    # cosi' si puo' pubblicare anche senza poter spingere un tag da locale.
    branches: [main, "release/v*"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # egui/eframe (X11/Wayland + OpenGL) e libcups (collegata dal crate `printers`)
      - name: Dipendenze di sistema
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # il runner a volte ha unattended-upgrades che tiene il lock di apt: senza questo
          # lo step resta fermo per decine di minuti su `apt-get update`
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libcups2-dev zstd

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compila e impacchetta
        # chmod esplicito: caricando i file dal browser il permesso di esecuzione si perde
        run: chmod +x build-unix.sh && ./build-unix.sh

      - name: Controlla i pacchetti
        run: |
          test -n "$(ls -A dist 2>/dev/null)" || { echo "dist/ vuota: nessun pacchetto Linux"; exit 1; }
          # oltre a .deb e .tar.gz c'e' il pacchetto di Arch (.pkg.tar.zst)
          test -n "$(ls dist/*.pkg.tar.zst 2>/dev/null)" || { echo "manca il pacchetto .pkg.tar.zst"; exit 1; }
          tar --zstd -tf dist/*.pkg.tar.zst | grep -q '^\./\.PKGINFO$' || { echo ".PKGINFO assente"; exit 1; }
          tar --zstd -tf dist/*.pkg.tar.zst | grep -q '^\./usr/lib/pdfreadercp/PDFReaderCP$' || { echo "binario assente nel pkg.tar.zst"; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: PDFReaderCP-linux
          path: dist/*
          if-no-files-found: error

  # Alpine Linux usa musl: il binario va compilato la' (PDFium musl) e impacchettato in .apk.
  alpine:
    name: Alpine Linux (apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Docker evita il problema delle action Node (glibc) dentro un container Alpine
      - name: Compila e impacchetta in Alpine
        run: docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh /src/.github/alpine-build.sh

      - name: Controlla il pacchetto .apk
        run: |
          test -n "$(ls dist/*.apk 2>/dev/null)" || { echo "manca il pacchetto .apk"; ls -l dist; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: PDFReaderCP-alpine
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS universale
    # macos-14 e' stato ritirato il 2 novembre 2026: l'allocazione del runner
    # fallisce con "configuration 'macos-14-arm64-us-default' is not supported".
    # macos-15 e' arm64 (Apple Silicon) e resta disponibile.
    runs-on: macos-15
    env:
      # deve corrispondere a LSMinimumSystemVersion in unix/Info.plist: senza questo
      # il binario compilato sul runner (macOS 15) richiederebbe macOS 15 anche
      # dichiarando 10.13 nel bundle.
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # i due target servono a `lipo` per il binario universale; vanno aggiunti
      # dopo la toolchain, perche' su un runner nuovo rustup non esiste ancora
      - name: Target universali
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Compila l'app universale
        run: bash build-unix.sh --universal --app

      # gli errori vengono mostrati come annotazione del run, cosi' si capisce
      # subito quale comando ha fallito (i log completi richiedono l'accesso)
      - name: Installer DMG
        run: |
          if ! bash build-unix.sh --universal --dmg 2>&1 | tee /tmp/dmg.log; then
            echo "::error::DMG: $(tail -4 /tmp/dmg.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Installer PKG
        run: |
          if ! bash build-unix.sh --universal --pkg 2>&1 | tee /tmp/pkg.log; then
            echo "::error::PKG: $(tail -4 /tmp/pkg.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Controlla il pacchetto macOS
        run: |
          set -e
          APP=dist/PDFReaderCP.app
          test -d "$APP" || { echo "manca $APP"; ls -l dist; exit 1; }
          # il binario deve contenere entrambe le architetture (arm64 + x86_64)
          lipo -archs "$APP/Contents/MacOS/PDFReaderCP"
          lipo -archs "$APP/Contents/MacOS/libpdfium.dylib"
          plutil -lint "$APP/Contents/Info.plist"
          test -n "$(ls dist/*.zip 2>/dev/null)" || { echo "manca lo zip del bundle"; exit 1; }
          # installer: DMG (trascina in Applicazioni) e PKG (doppio clic)
          test -n "$(ls dist/*.dmg 2>/dev/null)" || { echo "manca il dmg"; ls -l dist; exit 1; }
          test -n "$(ls dist/*.pkg 2>/dev/null)" || { echo "manca il pkg"; ls -l dist; exit 1; }
          hdiutil verify dist/*.dmg
          # il dmg deve contenere l'app e il collegamento ad Applicazioni
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" dist/*.dmg >/dev/null
          test -d "$MNT/PDFReaderCP.app" || { hdiutil detach "$MNT" >/dev/null; echo "app non trovata nel dmg"; exit 1; }
          test -L "$MNT/Applications" || { hdiutil detach "$MNT" >/dev/null; echo "manca il collegamento ad Applicazioni nel dmg"; exit 1; }
          test -f "$MNT/PDFReaderCP.app/Contents/MacOS/PDFReaderCP" || { hdiutil detach "$MNT" >/dev/null; echo "binario non trovato nel dmg"; exit 1; }
          hdiutil detach "$MNT" >/dev/null
          # il pkg deve contenere l'app (payload) destinata a /Applications
          if pkgutil --payload-files dist/*.pkg 2>/dev/null | grep -q 'Applications/PDFReaderCP.app/Contents/MacOS/PDFReaderCP'; then
            echo "payload del pkg: ok"
          else
            # per i pacchetti "distribution" il payload non e' elencabile: almeno la dimensione
            test "$(stat -f%z "$(ls dist/*.pkg | head -1)")" -gt 3000000 || { echo "pkg sospetto (troppo piccolo)"; exit 1; }
            echo "payload non elencabile, dimensione pkg plausibile"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: PDFReaderCP-macos
          path: dist/*
          if-no-files-found: error

  # Un solo job pubblica la release: due job che la creano in parallelo si
  # scontrano ("release already exists") e fanno risultare fallita una build ok.
  release:
    name: Pubblica la release
    needs: [linux, alpine, macos]
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Controlla gli asset da allegare
        run: |
          test -n "$(ls -A dist)" || { echo "nessun asset scaricato dagli altri job"; exit 1; }
          ls -l dist

      # tag v3.0.0 dal tag oppure dal ramo release/v3.0.0: la release ha sempre un nome di tag
      - name: Versione della release
        id: ver
        run: |
          if [ "${GITHUB_REF}" = "refs/tags/${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF_NAME#release/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG"

      - name: Allega alla Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PDF Reader CP ${{ steps.ver.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
